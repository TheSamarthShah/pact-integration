name = "pact-integration"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Point Cloudflare to the OpenNext compiled engine
main = ".open-next/worker.js"

# Tell Cloudflare where your static frontend files live
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# The service binding we fixed earlier
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "pact-integration"